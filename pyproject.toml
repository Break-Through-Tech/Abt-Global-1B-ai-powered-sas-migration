[project]
name = "abt-global-1b-ai-powered-sas-migration"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datacompy>=1.1.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyreadstat>=1.3.6",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[dependency-groups]
app = [
    "fastapi>=0.165.0",
    "httpx2>=2.16.2",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]
dev = [
    "ipykernel>=7.4.0",
]
